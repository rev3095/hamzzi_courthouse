[project]
name = "hamzzi-collector"
version = "0.1.0"
description = "햄찌법원 법령·판례 수집기 (공식 API 전용)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
]

[project.scripts]
hamzzi-collector = "hamzzi_collector:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
